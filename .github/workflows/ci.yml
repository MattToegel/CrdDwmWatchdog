name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run self-tests
        shell: pwsh
        run: dotnet .\bin\Release\net10.0-windows\win-x64\CrdDwmWatchdog.dll --self-test

      - name: Verify guarded restart dry run
        shell: pwsh
        run: dotnet .\bin\Release\net10.0-windows\win-x64\CrdDwmWatchdog.dll --dry-run-restart both
